services:
  auth-service:
    build:
      context: ../services/auth-service
    env_file:
      - ../.env
    environment:
      SQLSERVER_HOST: host.docker.internal
      SQLSERVER_USE_WINDOWS_AUTH: "false"
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"

  content-service:
    build:
      context: ../services/content-service
    env_file:
      - ../.env
    environment:
      SQLSERVER_HOST: host.docker.internal
      SQLSERVER_USE_WINDOWS_AUTH: "false"
      MEDIA_ROOT: /app
      ADMIN_TRANSLATION_URL: http://narration-service:8000/translate
      ADMIN_TTS_URL: http://narration-service:8000/tts
    volumes:
      - ../services/content-service/uploads:/app/uploads
    ports:
      - "${CONTENT_SERVICE_PORT:-8002}:8000"

  narration-service:
    build:
      context: ../services/narration-service
    env_file:
      - ../.env
    environment:
      NARRATION_ADAPTER_CACHE_PATH: /app/data/adapter.sqlite3
    volumes:
      - narration-adapter-data:/app/data
    ports:
      - "${NARRATION_SERVICE_PORT:-8003}:8000"

volumes:
  narration-adapter-data:
